# Redraws the contribution snake on the profile README every day.
# The SVGs land on the "output" branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6f906f&color_dots=#ebedf0,#d7e4d7,#a9c4a9,#6f906f,#3f5a3f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffd9b3&color_dots=#161b22,#2c3a30,#4a634a,#6f906f,#a9c4a9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
